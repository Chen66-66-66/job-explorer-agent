spring.application.name=job-explorer-agent

# 求职者档案：默认用虚构示例；本地 data/profile.local.yml 存在时覆盖（该文件不进 Git）
spring.config.import=classpath:profile-example.yml,optional:file:./data/profile.local.yml

# 内嵌数据库，数据文件在 data/ 下，免安装
spring.datasource.url=jdbc:h2:file:./data/jobexplorer;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 数据库控制台默认关闭，调试时再打开
spring.h2.console.enabled=false

# 个人工具只监听本机，不对局域网开放
server.address=127.0.0.1

# 大模型默认关闭。启用 DeepSeek：设置环境变量 LLM_PROVIDER=deepseek、LLM_API_KEY=你的密钥
spring.ai.model.chat=${LLM_PROVIDER:none}
spring.ai.deepseek.api-key=${LLM_API_KEY:}
spring.ai.deepseek.base-url=${LLM_BASE_URL:https://api.deepseek.com}
spring.ai.deepseek.chat.options.model=${LLM_MODEL:deepseek-chat}
spring.ai.deepseek.chat.options.temperature=0

# 首次启动时写入虚构演示数据
jobexplorer.demo-data=true
